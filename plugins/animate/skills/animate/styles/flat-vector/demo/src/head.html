<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat-vector demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f2a5a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  FLAT-VECTOR DEMO — 9:16, 8.0s @ 120 BPM, 24fps, motion on 1s. An idea (a coral circle with a light bulb) becomes a
//  product (a lilac rounded card with a growing bar chart); the circle morphs into the card. A friendly geometric
//  character watches, waves and then celebrates. Three small satellites orbit the shape in both eras.
//  Build: node <skill>/tools/build.mjs <skill>/styles/flat-vector/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 8.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif';
const CX = 500;   // caption centre x: the middle of the safe area (x 60-940)

const ERA_LIST = [[0, 4, () => sceneIdea()], [4, 8, () => sceneProduct()]];
const SHOTS = [
  ['idea',    0, 0.0, 4.0, 'an idea: a coral circle with a light bulb, three satellites, a waving character'],
  ['product', 1, 4.0, 8.0, 'the circle becomes a lilac card; a bar chart grows; the character celebrates'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [4.0],
  cues: { head: 0.2, shape: 0.5, bulb: 1.0, sat: 1.4, wave: 1.0, head2: 4.2, bars: 4.9, badge: 5.8, hop: 5.8 },
  acts: [
    { name: '1 Idea',    role: 'build', t0: 0.0, t1: 4.0 },
    { name: '2 Product', role: 'gift',  t0: 4.0, t1: 8.0 },
  ],
  board: [
    { t: 1.4, title: 'an idea gets three satellites', sound: 'soft plucks on each pop, a chime on the bulb', next: 'the circle becomes a card' },
    { t: 5.8, title: 'the idea ships as a product', sound: 'a pad, a chime on the badge', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
